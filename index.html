<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Classroom Deal or No Deal</title>
  <style>
    :root{--gold:#f7c948;--red:#d8202f;--panel:#111522}*{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030409;color:#fff;font-family:Arial,Helvetica,sans-serif}
    button,select,textarea{font:inherit}button{cursor:pointer}
    .shell{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% -12%,#ffd0503d,transparent 30%),radial-gradient(circle at 50% 58%,#1b376d6b,transparent 43%),linear-gradient(135deg,#06070d,#12182a 49%,#05060b)}
    header{min-height:82px;padding:12px clamp(14px,4vw,60px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f7c94847;background:#030409d9}
    .brand{border:0;background:none;color:var(--gold);font-weight:1000;font-size:clamp(20px,3vw,35px)}.brand i{font-size:.45em;color:#fff;background:var(--red);border-radius:50%;padding:8px 6px;font-style:normal}
    .actions{display:flex;gap:8px}.actions button,.reset{border:1px solid #ffffff2e;background:#ffffff12;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}
    .gold{border:1px solid #ffe79a!important;color:#171007!important;background:linear-gradient(#ffe993,#d99b20)!important;font-weight:950!important}
    .score{max-width:1380px;margin:auto;padding:13px clamp(12px,4vw,50px);display:grid;grid-template-columns:120px 1fr 120px;align-items:center;text-align:center}
    .score div:not(.status){display:flex;flex-direction:column}.score small,.desk small{color:#a9adba;letter-spacing:.15em;font-size:10px;font-weight:900}.score strong{color:var(--gold);font-size:24px}.status{font-size:clamp(13px,2vw,19px);font-weight:850}
    .board{max-width:1500px;margin:auto;padding:8px clamp(8px,2.5vw,38px) 24px;display:grid;grid-template-columns:minmax(130px,185px) 1fr minmax(130px,185px);gap:20px;align-items:start}
    .money{display:flex;flex-direction:column;gap:6px;padding-top:8px}.money div{min-height:33px;display:grid;place-items:center;padding:5px;color:#211601;background:linear-gradient(100deg,#8e5b09,#ffe287 48%,#a56d0d);border:1px solid #ffdc70;border-radius:5px;font-weight:950;font-size:clamp(10px,1.3vw,16px);transition:.25s}.money div.gone{opacity:.2;filter:grayscale(1);text-decoration:line-through;transform:scale(.94)}
    .personal-stage{display:none;margin:4px auto 8px;max-width:320px;text-align:center;padding:13px 18px 16px;border:2px solid #f7c9488c;border-radius:18px;background:radial-gradient(circle at 50% 30%,#f7c94826,transparent 65%),#080a11e8;box-shadow:0 0 34px #f7c94824}.personal-stage.show{display:block}.personal-stage small{display:block;margin-bottom:20px;color:var(--gold);font-size:11px;font-weight:1000;letter-spacing:.22em}.personal-stage .case{width:150px;min-height:88px;cursor:default;animation:personalGlow 1.4s ease-in-out infinite alternate}.personal-stage .case:hover{transform:none}.personal-stage .case em{font-size:9px}.grid{display:grid;grid-template-columns:repeat(6,minmax(70px,1fr));gap:clamp(9px,1.4vw,17px);padding:24px 8px 10px}.case{position:relative;min-height:82px;border:2px solid #f7d572;border-radius:9px;color:#171006;background:linear-gradient(135deg,#fff3b7,#b7770b 40%,#ffe69a 72%,#8f5705);box-shadow:inset 0 0 0 3px #46260033,0 10px 22px #0007;transition:.2s}
    .case:hover:not(:disabled){transform:translateY(-6px) scale(1.04);filter:brightness(1.15)}.handle{position:absolute;width:42%;height:16px;border:5px solid #c38b25;border-bottom:0;border-radius:10px 10px 0 0;top:-17px;left:29%}.face{font-size:clamp(18px,3vw,34px);font-weight:1000}.case em{position:absolute;bottom:3px;left:0;right:0;font-size:8px;font-style:normal;font-weight:950}.case.mine{outline:4px solid #fff;box-shadow:0 0 30px #f7c948e6}.case.opened{background:#181b24;color:#777b87;border-color:#4a4e59;box-shadow:none;transform:scale(.94)}.case.opened .face{font-size:clamp(8px,1.1vw,13px)}
.opened-zone{margin:18px 8px 4px;padding:12px 14px;border:1px solid #f7c94835;border-radius:14px;background:#05070dbd}.opened-zone h3{margin:0 0 10px;color:#aeb3c0;font-size:11px;letter-spacing:.16em}.opened-tray{display:flex;flex-wrap:wrap;gap:7px;min-height:31px}.opened-empty{color:#666c79;font-size:12px;font-weight:800}.opened-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid #ffffff24;border-radius:8px;background:#171a24;color:#cbd0dc;font-size:11px;font-weight:900}.opened-chip b{color:var(--gold)}
    .banner,.finish{margin:18px auto 0;max-width:610px;text-align:center;border:1px solid #f7c9488c;background:#080a11e6;padding:14px 22px;border-radius:16px}.banner small{display:block;color:#b9bdc8;font-weight:900}.banner strong{display:block;color:var(--gold);font-size:clamp(25px,4vw,42px)}.finish h2{margin:8px 0 15px}.finish button{margin:5px;padding:11px 15px;border-radius:9px}
    .desk{position:sticky;bottom:0;z-index:4;min-height:68px;padding:10px clamp(14px,4vw,60px);display:flex;align-items:center;gap:16px;background:#04050ae8;border-top:1px solid #f7c94840}.history-title{display:flex;flex-direction:column;flex:0 0 auto}.offer-history{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:3px 2px;scrollbar-width:thin}.offer-item{white-space:nowrap;border:1px solid #ffffff24;border-radius:8px;background:#ffffff0b;padding:7px 10px;font-size:12px;font-weight:900}.offer-item.accepted{border-color:#58e08b;color:#75f0a2}.offer-item.rejected{border-color:#ff6c77;color:#ff8790}.offer-empty{color:#7f8491;font-size:12px;font-weight:800}
    .backdrop,.final{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#000d;backdrop-filter:blur(10px)}
.case-reveal{position:fixed;inset:0;z-index:45;display:grid;place-items:center;text-align:center;overflow:hidden;background:radial-gradient(circle at center,#66460055,transparent 38%),#000e;backdrop-filter:blur(12px)}.case-reveal:before{content:"";position:absolute;inset:-55%;background:conic-gradient(transparent 0 8deg,#ffd75d42 9deg 11deg,transparent 12deg 24deg);animation:spin 2.4s linear infinite}.reveal-wrap{position:relative}.reveal-kicker{color:#fff;font-weight:1000;letter-spacing:.28em;font-size:clamp(13px,2vw,20px);animation:blink .38s infinite alternate}.reveal-case{margin:28px auto;width:min(310px,70vw);height:min(205px,47vw);display:grid;place-items:center;border:5px solid #ffe9a4;border-radius:19px;color:#171006;background:linear-gradient(135deg,#fff8ca,#a66504 36%,#ffe38b 70%,#6d3c00);box-shadow:0 0 25px #fff,0 0 90px #f7c948c9;animation:caseShake .16s infinite,pulse .7s ease-in-out infinite alternate}.reveal-case span{font-size:clamp(68px,15vw,135px);font-weight:1000}.reveal-count{color:var(--gold);font-size:clamp(22px,4vw,42px);font-weight:1000;text-shadow:0 0 18px #f7c948}.case-reveal.burst{animation:openingBurst .7s forwards}.revealed-value{color:var(--gold);font-size:clamp(46px,10vw,118px);font-weight:1000;line-height:1;text-shadow:0 0 25px #fff,0 0 55px #f7c948}.revealed-label{margin-top:18px;font-size:clamp(15px,2vw,23px);font-weight:1000;letter-spacing:.12em}.reveal-continue{margin-top:28px;min-width:190px;padding:14px 30px;border:2px solid #ffe79a;border-radius:12px;color:#171007;background:linear-gradient(#fff1a8,#d99b20);font-size:18px;font-weight:1000;box-shadow:0 0 28px #f7c94880;animation:pulse .7s ease-in-out infinite alternate}
    .modal{width:min(580px,96vw);border:2px solid var(--gold);border-radius:24px;text-align:center;background:radial-gradient(circle at 50% 0,#293350,#0a0c13 62%);padding:34px;position:relative}.modal h2{color:var(--gold);font-size:clamp(42px,9vw,78px);margin:10px 0 28px}.phone{font-size:54px}.decision{display:grid;grid-template-columns:1fr 1fr;gap:14px}.decision button{padding:18px;border-radius:12px;color:#fff;font-size:21px;font-weight:1000}.deal{background:linear-gradient(#29b767,#087836);border:2px solid #67ef9b}.nodeal{background:linear-gradient(#ef3947,#9d0e1b);border:2px solid #ff7c86}
    .setup{text-align:left}.setup h2{color:#fff;font-size:28px;margin:4px 0 20px}.close{position:absolute;right:16px;top:10px;border:0;background:none;color:#fff;font-size:30px}.setup label{display:block;margin:15px 0;font-size:13px;font-weight:900}.setup select,.setup textarea{display:block;width:100%;margin-top:7px;color:#fff;background:#090b11;border:1px solid #3a3e4b;border-radius:10px;padding:12px}.wide{width:100%;padding:13px;border-radius:10px}
    .final{z-index:50;text-align:center;overflow:hidden;background:radial-gradient(circle,#f7c94835,transparent 38%),#000}.final:before{content:"";position:absolute;inset:-45%;background:conic-gradient(transparent 0 9deg,#ffda6838 10deg 12deg,transparent 13deg 25deg);animation:spin 4s linear infinite}.final>*{position:relative}.final h1{color:#ed2637;font-size:clamp(44px,9vw,96px);margin:0}.mystery{width:min(290px,64vw);height:min(190px,42vw);display:grid;place-items:center;border:5px solid #ffe79a;border-radius:18px;color:#171006;background:linear-gradient(135deg,#fff7c7,#a86505 35%,#ffe288 70%,#714000);box-shadow:0 0 70px #f7c948b3;animation:pulse .62s ease-in-out infinite alternate}.mystery strong{font-size:clamp(62px,13vw,125px)}.final.flash{animation:flash .6s forwards}.prize strong{display:block;color:var(--gold);font-size:clamp(56px,12vw,145px);line-height:1;text-shadow:0 0 28px #f7c948}.prize span{display:block;margin:22px;font-size:clamp(18px,3vw,32px);font-weight:1000}
    @keyframes personalGlow{to{filter:brightness(1.18);box-shadow:inset 0 0 0 3px #46260033,0 0 34px #f7c948d9}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{transform:scale(1.07);filter:brightness(1.3)}}@keyframes flash{40%{background:#fff}100%{background:#fff8ce}}@keyframes caseShake{0%{transform:translate(-3px,1px) rotate(-1deg)}50%{transform:translate(3px,-1px) rotate(1deg)}100%{transform:translate(-2px,-1px)}}@keyframes blink{to{opacity:.35}}@keyframes openingBurst{0%{background:#000e}35%{background:#fff}58%{background:#ffe078}100%{background:#000f}}
    @media(max-width:900px){.board{grid-template-columns:105px 1fr 105px;gap:8px}.grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:620px){header{min-height:68px}.actions button:not(.gold):not(.reset){display:none}.score{grid-template-columns:65px 1fr 65px;padding:9px}.board{display:flex;flex-wrap:wrap;padding:4px 7px 82px}.money{flex:1;min-width:calc(50% - 5px);order:2}.center{width:100%;order:1}.grid{gap:10px 7px;padding:20px 0 5px}.case{min-height:60px}.desk{position:fixed;left:0;right:0}.modal{padding:26px 20px}}
  </style>
</head>
<body>
<main class="shell">
  <header><button class="brand" id="brand">DEAL <i>OR</i> NO DEAL</button><div class="actions"><button id="sound">🔊 Sound</button><button id="rules">How to play</button><button class="gold" id="setup">Game setup</button><button class="reset" id="reset">↻ New game</button></div></header>
  <section class="score"><div><small>ROUND</small><strong id="round">1</strong></div><div class="status" id="status">Choose your personal case to begin.</div><div><small>CASES LEFT</small><strong id="left">24</strong></div></section>
  <section class="board"><aside class="money" id="low"></aside><div class="center"><section class="personal-stage" id="personalStage"></section><div class="grid" id="cases"></div><div id="notice"></div></div><aside class="money" id="high"></aside></section>
  <footer class="desk"><div class="history-title"><small>BANKER OFFER</small><strong>HISTORY</strong></div><div class="offer-history" id="offerHistory"><span class="offer-empty">No offers yet</span></div></footer>
</main>
<div id="overlay"></div>
<script>
const DEFAULT=[1,5,10,25,50,100,250,500,750,1000,2500,5000,7500,10000,25000,50000,75000,100000,150000,200000,300000,500000,750000,1000000];
let unit="Points",values=[...DEFAULT],cases=[],mine=null,round=1,opened=0,offer=null,last=null,over=false,sound=true,offerHistory=[],opening=false,pendingReveal=null;
const $=id=>document.getElementById(id),fmt=n=>unit==="₱"?"₱"+n.toLocaleString():n.toLocaleString()+" "+unit;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ping(f=620,d=.12){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function reset(){cases=shuffle(values).map((value,i)=>({id:i+1,value,open:false}));mine=null;round=1;opened=0;offer=null;last=null;over=false;offerHistory=[];opening=false;pendingReveal=null;$("overlay").innerHTML="";render("Choose your personal case to begin.")}
function count(){return Math.max(1,6-round)}function remaining(){return cases.filter(c=>!c.open)}
function render(msg){if(msg)$("status").textContent=msg;$("round").textContent=round;$("left").textContent=remaining().length;$("offerHistory").innerHTML=offerHistory.length?offerHistory.map((o,i)=>`<span class="offer-item ${o.status}">#${i+1} · ${fmt(o.amount)} · ${o.status==="accepted"?"DEAL":o.status==="rejected"?"NO DEAL":"PENDING"}</span>`).join(""):`<span class="offer-empty">No offers yet</span>`;
  const personal=mine===null?null:cases.find(c=>c.id===mine);$("personalStage").className=`personal-stage ${personal&&!personal.open?"show":""}`;$("personalStage").innerHTML=personal&&!personal.open?`<small>YOUR SELECTED BRIEFCASE</small><button class="case mine" disabled><span class="handle"></span><span class="face">${personal.id}</span><em>SAFE UNTIL THE FINAL REVEAL</em></button>`:"";
  $("cases").innerHTML=cases.filter(c=>c.id!==mine).map(c=>`<button class="case ${c.open?"opened":""}" ${c.open||over||offer!==null||opening?"disabled":""} onclick="choose(${c.id})"><span class="handle"></span><span class="face">${c.open?fmt(c.value):c.id}</span>${c.open?`<em>CASE ${c.id} · OPENED</em>`:""}</button>`).join("");
  const sorted=[...values].sort((a,b)=>a-b),active=new Set(remaining().map(c=>c.value)),half=Math.ceil(sorted.length/2);const row=v=>`<div class="${active.has(v)?"":"gone"}">${fmt(v)}</div>`;$("low").innerHTML=sorted.slice(0,half).map(row).join("");$("high").innerHTML=sorted.slice(half).map(row).join("");
  $("notice").innerHTML=last&&!offer?`<div class="banner"><small>CASE ${last.id} CONTAINED</small><strong>${fmt(last.value)}</strong></div>`:"";
  if(over&&document.querySelector(".final")===null)$("notice").innerHTML+=`<div class="finish"><h2>${$("status").textContent}</h2>${mine&&!cases.find(c=>c.id===mine).open?'<button onclick="revealMine()">Reveal my case</button>':""}<button class="gold" onclick="reset()">Play again</button></div>`;
}
function choose(id){if(over||offer!==null||opening)return;if(mine===null){mine=id;ping(820,.18);render(`Case ${id} is yours. Open ${count()} other cases.`);return}if(id===mine)return;let c=cases.find(x=>x.id===id);if(!c||c.open)return;opening=true;render(`Opening Case ${id}…`);$("overlay").innerHTML=`<div class="case-reveal" id="caseReveal"><div class="reveal-wrap"><div class="reveal-kicker">OPENING CASE</div><div class="reveal-case"><span>${id}</span></div><div class="reveal-count" id="revealCount">GET READY…</div></div></div>`;ping(145,.7);setTimeout(()=>{$("revealCount").textContent="3";ping(260,.18)},350);setTimeout(()=>{$("revealCount").textContent="2";ping(340,.18)},700);setTimeout(()=>{$("revealCount").textContent="1";ping(430,.2)},1050);setTimeout(()=>{const el=$("caseReveal");if(el)el.classList.add("burst");ping(1150,.35)},1370);setTimeout(()=>{pendingReveal=id;$("overlay").innerHTML=`<div class="case-reveal"><div class="reveal-wrap"><div class="revealed-value">${fmt(c.value)}</div><div class="revealed-label">CASE ${id} CONTAINED</div><button class="reveal-continue" onclick="continueReveal()">CONTINUE</button></div></div>`;ping(c.value>=100000?1080:c.value>=5000?720:260,.65)},1760)}
function continueReveal(){if(pendingReveal===null)return;let c=cases.find(x=>x.id===pendingReveal);pendingReveal=null;if(!c||c.open)return;c.open=true;last=c;opened++;opening=false;$("overlay").innerHTML="";let rem=remaining();render(rem.length===2?"Only two cases remain. The Banker is calling!":opened>=count()?"The Banker is calling…":`Open ${count()-opened} more case(s).`);if(rem.length===2||opened>=count())setTimeout(()=>banker(rem),500)}
function banker(rem){let avg=rem.reduce((s,c)=>s+c.value,0)/rem.length,risk=Math.min(.93,.48+round*.075);offer=Math.max(1,Math.round(avg*risk/5)*5);offerHistory.push({amount:offer,status:"pending"});ping(390,.45);render();$("overlay").innerHTML=`<div class="backdrop"><section class="modal"><div class="phone">☎</div><p>THE BANKER OFFERS</p><h2>${fmt(offer)}</h2><div class="decision"><button class="deal" onclick="deal()">DEAL</button><button class="nodeal" onclick="noDeal()">NO DEAL</button></div></section></div>`}
function deal(){offerHistory[offerHistory.length-1].status="accepted";over=true;$("overlay").innerHTML="";ping(980,.65);render(`DEAL! You won ${fmt(offer)}.`)}
function noDeal(){offerHistory[offerHistory.length-1].status="rejected";if(remaining().length===2){offer=null;$("overlay").innerHTML=`<div class="final" id="final"><div><h1>NO DEAL</h1><p>THE MOMENT OF TRUTH</p><div class="mystery"><strong>${mine}</strong></div><h2>WHAT'S INSIDE?</h2></div></div>`;ping(170,.7);setTimeout(()=>{$("final").classList.add("flash");ping(1050,.3)},1800);setTimeout(finalReveal,2400);return}offer=null;round++;opened=0;last=null;$("overlay").innerHTML="";ping(760,.2);render(`No Deal! Open ${count()} more case(s).`)}
function finalReveal(){let c=cases.find(x=>x.id===mine);c.open=true;last=c;over=true;ping(c.value>=100000?1150:720,.85);$("status").textContent=`Your case contained ${fmt(c.value)}!`;$("overlay").innerHTML=`<div class="final"><div class="prize"><small>YOUR CASE CONTAINED</small><strong>${fmt(c.value)}</strong><span>CONGRATULATIONS!</span><button class="gold wide" onclick="closeFinal()">Continue</button></div></div>`;render()}
function closeFinal(){$("overlay").innerHTML="";render()}function revealMine(){let c=cases.find(x=>x.id===mine);c.open=true;last=c;over=true;render(`Your case contained ${fmt(c.value)}!`)}
function setup(){ $("overlay").innerHTML=`<div class="backdrop"><section class="modal setup"><button class="close" onclick="closeFinal()">×</button><p>TEACHER CONTROLS</p><h2>Customize your classroom game</h2><label>Prize label<select id="unit"><option>Points</option><option>Stars</option><option>Coins</option><option>₱</option></select></label><label>Prize values (exactly 24)<textarea id="vals" rows="5">${values.join(", ")}</textarea></label><button class="gold wide" onclick="apply()">Shuffle & start game</button></section></div>`;$("unit").value=unit}
function apply(){let a=$("vals").value.split(/[,\n]/).map(x=>Number(x.trim())).filter(Number.isFinite);if(a.length!==24){alert("Please enter exactly 24 valid prize values.");return}unit=$("unit").value;values=a;reset()}
function rules(){$("overlay").innerHTML=`<div class="backdrop"><section class="modal setup"><button class="close" onclick="closeFinal()">×</button><h2>How to play</h2><ol><li>Choose one case to keep.</li><li>Open the required number of cases each round.</li><li>Choose Deal or No Deal when the Banker calls.</li><li>If two cases remain and you choose No Deal, your case is revealed dramatically.</li></ol></section></div>`}
$("brand").onclick=reset;$("reset").onclick=reset;$("setup").onclick=setup;$("rules").onclick=rules;$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 Sound":"🔇 Muted"};reset();
</script>
</body>
</html>
